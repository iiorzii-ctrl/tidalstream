# Render 用の設定。リポジトリを繋ぐとこの内容で web サービスが作られる。
# sync: false の項目は Render の画面から値を入れる（リポジトリには残らない）。
# 港湾気象予報を使う場合は UMITEN_* の3つにも値を入れる。URL そのものが
# 契約者ごとの秘密なので、値をここに書かないこと。
services:
  - type: web
    name: tidalstream
    runtime: node
    plan: free
    region: singapore # 上流が日本にあるので近いリージョンを選ぶ
    buildCommand: 'echo "no dependencies to install"'
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: HOST
        value: 0.0.0.0
      - key: AUTH_USER
        sync: false
      - key: AUTH_PASS
        sync: false
      - key: UMITEN_INDEX_URL
        sync: false
      - key: UMITEN_USER
        sync: false
      - key: UMITEN_PASS
        sync: false
