<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)" />
    <!-- iPad などでホーム画面に追加したときの表示名 -->
    <meta name="apple-mobile-web-app-title" content="潮流推算" />
    <title>潮流推算ビューア — 1時間ごとに3枚</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%8C%8A%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar-row">
        <div class="bar-title">
          <p class="eyebrow" data-i18n="app.eyebrow">海上保安庁 海洋情報部</p>
          <h1 data-i18n="app.title">潮流推算ビューア</h1>
        </div>
        <button type="button" id="langToggle" class="lang-toggle" data-i18n="lang.toggle" data-i18n-aria="lang.toggleAria">
          English
        </button>
      </div>
      <p class="note" data-i18n="app.lede">
        海上保安庁「潮流推算」ページの図を、指定時刻から1時間ごとに横並びで表示します。
      </p>
    </header>

    <form id="controls" class="controls">
      <label>
        <span data-i18n="controls.area">海域</span>
        <select id="area" name="area"></select>
      </label>
      <label>
        <span data-i18n="controls.date">日付</span>
        <input type="date" id="date" name="date" />
      </label>
      <label>
        <span data-i18n="controls.hour">開始時刻</span>
        <select id="hour" name="hour"></select>
      </label>
      <label>
        <span data-i18n="controls.step">間隔</span>
        <select id="step" name="step">
          <option value="1" selected data-i18n-n="controls.stepHours">1時間</option>
          <option value="2" data-i18n-n="controls.stepHours">2時間</option>
          <option value="3" data-i18n-n="controls.stepHours">3時間</option>
          <option value="6" data-i18n-n="controls.stepHours">6時間</option>
        </select>
      </label>
      <label>
        <span data-i18n="controls.count">枚数</span>
        <select id="count" name="count">
          <option value="2" data-i18n-n="controls.countSheets">2枚</option>
          <option value="3" selected data-i18n-n="controls.countSheets">3枚</option>
          <option value="4" data-i18n-n="controls.countSheets">4枚</option>
          <option value="6" data-i18n-n="controls.countSheets">6枚</option>
        </select>
      </label>
      <button type="submit" id="load" data-i18n="controls.load">表示</button>
      <button type="button" id="now" data-i18n="controls.now">現在時刻</button>
      <button type="button" id="print" data-i18n="controls.print">印刷</button>
      <label class="check">
        <input type="checkbox" id="autoRefresh" />
        <span data-i18n="controls.autoRefresh">毎時自動更新</span>
      </label>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <main id="frames" class="frames"></main>

    <section id="point" class="point" hidden>
      <div class="point-head">
        <h2 id="pointTitle" data-i18n="point.title">地点の流速</h2>
        <div class="point-actions">
          <button type="button" id="toggleTable" aria-expanded="false" data-i18n="point.showTable">表で見る</button>
          <a id="csvLink" class="button-link" href="#" download>CSV</a>
          <button type="button" id="clearPoint" data-i18n="point.clear">選択を解除</button>
        </div>
      </div>
      <p id="pointStats" class="point-stats"></p>
      <div id="arrowStrip" class="arrow-strip" hidden>
        <span class="arrow-strip-label" data-i18n="point.arrowLabel">流れの向き（各時刻の矢印を拡大）</span>
        <div id="arrowCrops" class="arrow-crops"></div>
      </div>
      <div id="chart" class="chart"></div>
      <div id="pointTable" class="point-table" hidden></div>
    </section>

    <footer class="foot">
      <p>
        <span data-i18n="foot.sourcePrefix">出典:</span>
        <a
          href="https://www1.kaiho.mlit.go.jp/TIDE/pred2/cgi-bin/CurrPredCgi_K.cgi?area=01"
          rel="noreferrer noopener"
          target="_blank"
          data-i18n="foot.sourceName"
          >「潮流推算」（海上保安庁 海洋情報部ホームページ）</a
        >
        <span data-i18n="foot.processed">／グラフ・表・CSV は同ページの値をもとに作成</span>
      </p>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
