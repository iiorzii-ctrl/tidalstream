<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="東京湾 風予報" />
    <title>東京湾 風予報 — 地図と時刻</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%92%A8%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./wind.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar-row">
        <div class="bar-title">
          <p class="eyebrow">東京湾沿岸</p>
          <h1>風予報</h1>
        </div>
        <a class="button-link" href="./index.html">潮流推算へ</a>
      </div>
      <p class="note" id="sourceNote">読み込み中…</p>
    </header>

    <p id="sampleWarning" class="wind-warning" hidden>
      表示しているのは<strong>作り物のサンプルデータ</strong>で、実際の予報ではありません。
    </p>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <main class="wind-main">
      <div class="wind-mapwrap">
        <svg id="map" class="wind-map" role="img" aria-label="東京湾の地図と各地点の風速"></svg>
        <p class="wind-schematic-note">地図は位置関係を示す模式図です（海図ではありません）</p>
      </div>

      <div class="wind-timebar">
        <div class="wind-timebar-head">
          <button type="button" id="play" class="wind-play" aria-label="再生">▶</button>
          <output id="timeLabel" class="wind-time" for="timeSlider"></output>
          <div class="wind-units" role="group" aria-label="単位">
            <button type="button" id="unitMs" class="is-on">m/s</button>
            <button type="button" id="unitKt">kt</button>
          </div>
        </div>
        <input type="range" id="timeSlider" class="wind-slider" min="0" max="0" value="0" step="1" aria-label="時刻" />
        <div class="wind-ticks" id="timeTicks" aria-hidden="true"></div>
      </div>

      <table class="wind-table" id="windTable">
        <caption>選んだ時刻の一覧（地点名を押すと、その地点の予報ページを開きます）</caption>
        <thead>
          <tr>
            <th scope="col">地点</th>
            <th scope="col">風速</th>
            <th scope="col">突風</th>
            <th scope="col">風向</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>

    <footer class="foot">
      <p id="footSource"></p>
      <p>風向は「風が吹いてくる方角」です。矢印は風が吹いていく向きに描いています。</p>
    </footer>

    <script type="module" src="./wind.js"></script>
  </body>
</html>
